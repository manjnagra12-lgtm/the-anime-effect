{% extends "base.html" %}
{% block title %}Log in · The Anime Effect{% endblock %}
{% block content %}
  <section class="form-panel auth-panel">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in<span class="text-accent">.</span></h1>
    <p class="muted">Sign in to pick up where you left off.</p>
    <form method="post" class="site-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button class="button button-wide" type="submit">Log in</button>
    </form>
    <p class="form-footnote">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
  </section>
{% endblock %}
